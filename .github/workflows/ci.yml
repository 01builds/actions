name: Action CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    name: Build & Test Action
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Run Unit Tests
        run: pnpm test

      - name: Build Action Bundle
        run: pnpm run build

      - name: Self-Test Action Execution
        uses: ./
        with:
          api-directory: '.'
          web-directory: '.'
          coverage-threshold: '80'
