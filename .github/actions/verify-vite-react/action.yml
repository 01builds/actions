name: 'Vite React Web Verification'
description: 'Typechecks TypeScript, runs Vitest test suite, and builds production web assets.'

inputs:
  working-directory:
    description: 'Path to application directory'
    required: false
    default: '.'
  node-version:
    description: 'Node.js version'
    required: false
    default: '22'

runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 10

    - name: Install Dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: pnpm install --frozen-lockfile

    - name: Run Typecheck
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: pnpm tsc --noEmit

    - name: Run Vitest Suite
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: pnpm exec vitest run --coverage

    - name: Build Web Bundle
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: pnpm run build
