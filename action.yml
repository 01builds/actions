name: '01builds AI Guardrails'
description: 'Enterprise-grade quality gates, differential test coverage, and AI code review for Hono, Vite+React, and Cloudflare Workers.'
author: '01builds'

branding:
  icon: 'shield-check'
  color: 'blue'

inputs:
  hono-dir:
    description: 'Path to Hono API backend directory'
    required: false
    default: '.'
  vite-dir:
    description: 'Path to Vite + React frontend directory'
    required: false
    default: '.'
  min-coverage:
    description: 'Minimum required differential test coverage percentage'
    required: false
    default: '80'
  gemini-api-key:
    description: 'Gemini API Key for AI code review'
    required: false

outputs:
  report-path:
    description: 'Path to generated JSON guardrail report'
    value: 'guardrail-report.json'
  passed:
    description: 'Whether all guardrails passed cleanly (true/false)'
    value: '${{ steps.guardrail-step.outputs.passed }}'

runs:
  using: 'node20'
  main: 'dist/index.js'
