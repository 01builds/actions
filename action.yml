name: '01builds Quality Gate'
description: 'Quality verification, differential test coverage, and automated code review.'
author: '01builds'

branding:
  icon: 'shield'
  color: 'blue'

inputs:
  api-directory:
    description: 'Path to API backend application directory'
    required: false
    default: '.'
  web-directory:
    description: 'Path to web frontend application directory'
    required: false
    default: '.'
  coverage-threshold:
    description: 'Minimum required differential test coverage percentage'
    required: false
    default: '80'
  llm-api-key:
    description: 'API key for automated code review'
    required: false

outputs:
  report-path:
    description: 'Path to generated JSON summary report'
    value: 'quality-gate-report.json'
  passed:
    description: 'Status of quality gate execution'
    value: '${{ steps.gate-step.outputs.passed }}'

runs:
  using: 'node24'
  main: 'dist/index.js'
